services:
  static:
    image: gitlab.dwteam.ru:5050/dwteam/docker-images/nginx:1.28.0-alpine3.21_2025.05.30
    restart: unless-stopped
    volumes:
      - .vitepress/dist:/usr/share/nginx/html
      - .vitepress/dist:/usr/share/nginx/html/tactics
    ports:
      - "8990:80"
  wiki:
    build:
      context: docker
      target: node22
      args:
        - UID=${UID}
        - GID=${GID}
    restart: unless-stopped
    volumes:
      - .:/var/www/frontend
    command: sh -c 'yarn install && yarn docs:dev'
    ports:
      - "8989:8989"
